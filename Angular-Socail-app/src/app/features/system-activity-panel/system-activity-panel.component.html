<section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div>
      <h2 class="font-bold text-slate-950">System activity</h2>
      <p class="text-xs text-slate-500">Real app actions and backend results.</p>
    </div>
    <button class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-ocean hover:text-ocean" type="button" (click)="clear()">
      Clear
    </button>
  </div>

  <div class="mt-4 max-h-[28rem] space-y-2 overflow-y-auto pr-1">
    @for (event of store.activity(); track event.id) {
      <article class="rounded-lg border p-3" [ngClass]="levelClass(event.level)">
        <div class="flex items-start justify-between gap-3">
          <p class="text-sm font-bold">{{ event.title }}</p>
          <time class="shrink-0 text-xs opacity-75">{{ event.createdAt }}</time>
        </div>
        <p class="mt-1 text-xs leading-5">{{ event.detail }}</p>
      </article>
    } @empty {
      <p class="rounded-lg border border-dashed border-slate-300 p-4 text-sm text-slate-500">No system activity yet.</p>
    }
  </div>
</section>
